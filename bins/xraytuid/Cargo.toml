[package]
name = "xraytuid"
description = "xraytui per-user desired-state daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xraytuid"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
xraytui-controller = { workspace = true }
xraytui-linux-net = { workspace = true }
xraytui-netd-protocol = { workspace = true }
xraytui-config = { workspace = true }
xraytui-ipc = { workspace = true }
xraytui-domain = { workspace = true }
xraytui-import = { workspace = true }
xraytui-subscription = { workspace = true }
xraytui-xray-api = { workspace = true }
xraytui-xray-compiler = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
rustix = { workspace = true, features = ["process", "fs"] }
ipnet = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
xraytui-secrets = { workspace = true }
