name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  quality:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The cross-package end-to-end suite executes all three real binaries.
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps

  security:
    name: Dependency policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # rustsec/audit-check publishes its result as a Check Run on pushes.
      checks: write
    env:
      # cargo-audit tracks current stable Rust independently of the project's
      # supported toolchain, so build the policy tools with current stable.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2

  combined-network:
    name: Combined TUN + resolved (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            tag: v26.3.27
            sha256: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
          - channel: preview
            tag: v26.7.28
            sha256: 8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler unzip
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Download and verify official Xray
        env:
          XRAY_TAG: ${{ matrix.tag }}
          XRAY_SHA256: ${{ matrix.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/xray"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/Xray-linux-64.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_TAG}/Xray-linux-64.zip"
          echo "${XRAY_SHA256}  $RUNNER_TEMP/Xray-linux-64.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/Xray-linux-64.zip" -d "$RUNNER_TEMP/xray"
          "$RUNNER_TEMP/xray/xray" version
      - name: Exercise combined dual-stack and failure path
        env:
          XRAYTUI_CONTAINER_RUNTIME: docker
          XRAYTUI_TEST_XRAY: ${{ runner.temp }}/xray/xray
        run: scripts/combined-netns-test.sh

  arch-package:
    name: Clean Arch package build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # The Arch base-devel image does not include Git. Install it before
      # checkout so actions/checkout creates the repository metadata required
      # by scripts/source-dist.sh instead of falling back to a REST snapshot.
      - name: Install clean build dependencies
        run: pacman -Syu --noconfirm git rust protobuf
      - uses: actions/checkout@v5
      - name: Trust the runner-mounted worktree
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build deterministic source archive
        run: |
          umask 0022
          sh scripts/source-dist.sh target/dist-umask-022
          umask 0002
          sh scripts/source-dist.sh target/dist
          cmp target/dist-umask-022/xraytui-1.1.0.tar.gz target/dist/xraytui-1.1.0.tar.gz
      - name: Point the package test at the checked-out source
        run: |
          source_sum=$(sha256sum target/dist/xraytui-1.1.0.tar.gz | cut -d ' ' -f 1)
          sed -i "s/^sha256sums=.*/sha256sums=('${source_sum}')/" packaging/arch/PKGBUILD
          grep -F "sha256sums=('${source_sum}')" packaging/arch/PKGBUILD
      - name: Build and test with makepkg as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && SRCDEST='$GITHUB_WORKSPACE/target/dist' makepkg --nodeps --noconfirm"
