[package]
name = "xraytui-test-support"
description = "Mock egress servers, fixtures and helpers for xraytui tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
xraytui-domain = { workspace = true }
xraytui-secrets = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "macros", "sync"] }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
rustix = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
