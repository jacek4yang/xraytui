[package]
name = "xraytui-tui"
description = "ratatui front end for xraytui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
xraytui-domain = { workspace = true }
xraytui-secrets = { workspace = true }
xraytui-ipc = { workspace = true }
xraytui-import = { workspace = true }
xraytui-xray-compiler = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
nucleo-matcher = { workspace = true }
unicode-width = { workspace = true }
time = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
