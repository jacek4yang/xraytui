[package]
name = "xraytui-controller"
description = "Desired-state controller, core supervision and reconciliation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
xraytui-domain = { workspace = true }
xraytui-secrets = { workspace = true }
xraytui-config = { workspace = true }
xraytui-import = { workspace = true }
xraytui-subscription = { workspace = true }
xraytui-xray-model = { workspace = true }
xraytui-xray-compiler = { workspace = true }
xraytui-xray-api = { workspace = true }
xraytui-state-store = { workspace = true }
xraytui-ipc = { workspace = true }
xraytui-netd-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "process", "net", "time", "io-util", "fs", "signal", "sync"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
rand = { workspace = true }
futures-util = { workspace = true }
rustix = { workspace = true, features = ["process", "fs"] }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "net", "time", "io-util", "fs", "signal", "sync"] }
xraytui-xray-api = { workspace = true }
xraytui-test-support = { workspace = true }
# Test-only, and only for `tests/netns_transparent.rs`: acceptance scenario M is
# a claim about the core *and* the kernel at once, so proving it needs the
# privileged engine as well as this crate's. Nothing shipped here links against
# it, and `xraytui-linux-net` does not depend on this crate, so there is no cycle.
xraytui-linux-net = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
