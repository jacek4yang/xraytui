[package]
name = "xraytui-import"
description = "Share-link, QR and Xray JSON import/export for xraytui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
xraytui-domain = { workspace = true }
xraytui-secrets = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
tracing = { workspace = true }
qrcode = { workspace = true }
image = { workspace = true }
# Normal dependency, not dev: `qr::decode_png` is part of the library API, so the
# independent decoder has to be present in ordinary builds.
quircs = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
