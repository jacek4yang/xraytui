# Dependency policy. Security advisories are not ignored: a release lockfile
# must pass the current RustSec database without an exception.

[advisories]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    # This project's own licence.
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are allowed: pinning the whole tree to one version of every
# transitive dependency is a bigger source of breakage than the duplication is
# of risk, and this is an application rather than a library.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
